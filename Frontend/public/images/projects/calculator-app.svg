<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mobileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenMobile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="450" fill="url(#mobileBg)" />

  <!-- Ambient Glow -->
  <circle cx="400" cy="225" r="160" fill="#10b981" opacity="0.1" filter="blur(50px)" />

  <!-- Phone Mockup Container -->
  <rect x="290" y="30" width="220" height="390" rx="36" fill="#0f172a" stroke="rgba(255,255,255,0.18)" stroke-width="4" />
  
  <!-- Speaker & camera notch -->
  <rect x="365" y="44" width="70" height="8" rx="4" fill="#334155" />
  <circle cx="450" cy="48" r="3" fill="#1e293b" />

  <!-- Phone Screen -->
  <rect x="302" y="62" width="196" height="342" rx="24" fill="url(#screenMobile)" />

  <!-- Status Bar -->
  <text x="315" y="80" fill="#94a3b8" font-size="9" font-family="sans-serif">9:41</text>
  <circle cx="480" cy="77" r="3" fill="#10b981" />

  <!-- Calculator Display Area -->
  <rect x="312" y="95" width="176" height="75" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.06)" />
  <text x="475" y="125" fill="#64748b" font-size="12" font-family="sans-serif" text-anchor="end">2,450 × 1.15</text>
  <text x="475" y="155" fill="#10b981" font-size="22" font-family="sans-serif" font-weight="bold" text-anchor="end">2,817.50</text>

  <!-- Keypad Grid -->
  <g transform="translate(315, 185)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="38" height="32" rx="8" fill="#334155" />
    <text x="19" y="20" fill="#f43f5e" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold">C</text>

    <rect x="44" y="0" width="38" height="32" rx="8" fill="#334155" />
    <text x="63" y="20" fill="#38bdf8" font-size="12" font-family="sans-serif" text-anchor="middle">±</text>

    <rect x="88" y="0" width="38" height="32" rx="8" fill="#334155" />
    <text x="107" y="20" fill="#38bdf8" font-size="12" font-family="sans-serif" text-anchor="middle">%</text>

    <rect x="132" y="0" width="38" height="32" rx="8" fill="url(#emeraldGrad)" />
    <text x="151" y="20" fill="#fff" font-size="13" font-family="sans-serif" text-anchor="middle">÷</text>

    <!-- Row 2 -->
    <rect x="0" y="38" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="19" y="58" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">7</text>

    <rect x="44" y="38" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="63" y="58" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">8</text>

    <rect x="88" y="38" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="107" y="58" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">9</text>

    <rect x="132" y="38" width="38" height="32" rx="8" fill="url(#emeraldGrad)" />
    <text x="151" y="58" fill="#fff" font-size="13" font-family="sans-serif" text-anchor="middle">×</text>

    <!-- Row 3 -->
    <rect x="0" y="76" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="19" y="96" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">4</text>

    <rect x="44" y="76" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="63" y="96" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">5</text>

    <rect x="88" y="76" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="107" y="96" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">6</text>

    <rect x="132" y="76" width="38" height="32" rx="8" fill="url(#emeraldGrad)" />
    <text x="151" y="96" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">−</text>

    <!-- Row 4 -->
    <rect x="0" y="114" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="19" y="134" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">1</text>

    <rect x="44" y="114" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="63" y="134" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">2</text>

    <rect x="88" y="114" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="107" y="134" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">3</text>

    <rect x="132" y="114" width="38" height="32" rx="8" fill="url(#emeraldGrad)" />
    <text x="151" y="134" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">+</text>

    <!-- Row 5 -->
    <rect x="0" y="152" width="82" height="32" rx="8" fill="#1e293b" />
    <text x="41" y="172" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">0</text>

    <rect x="88" y="152" width="38" height="32" rx="8" fill="#1e293b" />
    <text x="107" y="172" fill="#fff" font-size="12" font-family="sans-serif" text-anchor="middle">.</text>

    <rect x="132" y="152" width="38" height="32" rx="8" fill="url(#emeraldGrad)" />
    <text x="151" y="172" fill="#fff" font-size="14" font-family="sans-serif" text-anchor="middle">=</text>
  </g>
</svg>
