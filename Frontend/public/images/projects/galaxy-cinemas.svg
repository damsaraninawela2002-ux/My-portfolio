<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#cineBg)" />

  <!-- Theater Screen Arc -->
  <path d="M 220 120 Q 400 95 580 120" stroke="#38bdf8" stroke-width="4" fill="none" opacity="0.9" filter="drop-shadow(0 0 10px #38bdf8)" />
  <path d="M 220 120 Q 400 95 580 120 L 520 200 L 280 200 Z" fill="url(#screenGrad)" opacity="0.15" />
  <text x="400" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="bold" letter-spacing="3">THEATER SCREEN</text>

  <!-- Cinema Window Frame -->
  <rect x="140" y="45" width="520" height="360" rx="20" fill="#0b1120" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" />

  <!-- Cinema Seats Grid -->
  <g transform="translate(240, 160)">
    <!-- Row 1 -->
    <circle cx="0" cy="0" r="10" fill="#334155" />
    <circle cx="35" cy="0" r="10" fill="#334155" />
    <circle cx="70" cy="0" r="10" fill="#38bdf8" />
    <circle cx="105" cy="0" r="10" fill="#38bdf8" />
    <circle cx="140" cy="0" r="10" fill="#334155" />
    <circle cx="210" cy="0" r="10" fill="#334155" />
    <circle cx="245" cy="0" r="10" fill="#334155" />
    <circle cx="280" cy="0" r="10" fill="#334155" />
    <circle cx="315" cy="0" r="10" fill="#38bdf8" />

    <!-- Row 2 -->
    <circle cx="0" cy="35" r="10" fill="#334155" />
    <circle cx="35" cy="35" r="10" fill="#f43f5e" />
    <circle cx="70" cy="35" r="10" fill="#f43f5e" />
    <circle cx="105" cy="35" r="10" fill="#334155" />
    <circle cx="140" cy="35" r="10" fill="#38bdf8" />
    <circle cx="210" cy="35" r="10" fill="#38bdf8" />
    <circle cx="245" cy="35" r="10" fill="#334155" />
    <circle cx="280" cy="35" r="10" fill="#334155" />
    <circle cx="315" cy="35" r="10" fill="#334155" />

    <!-- Row 3 (VIP) -->
    <circle cx="0" cy="70" r="10" fill="#fbbf24" />
    <circle cx="35" cy="70" r="10" fill="#fbbf24" />
    <circle cx="70" cy="70" r="10" fill="#334155" />
    <circle cx="105" cy="70" r="10" fill="#334155" />
    <circle cx="140" cy="70" r="10" fill="#f43f5e" />
    <circle cx="210" cy="70" r="10" fill="#f43f5e" />
    <circle cx="245" cy="70" r="10" fill="#334155" />
    <circle cx="280" cy="70" r="10" fill="#fbbf24" />
    <circle cx="315" cy="70" r="10" fill="#fbbf24" />
  </g>

  <!-- Legend -->
  <g transform="translate(230, 280)">
    <circle cx="20" cy="0" r="6" fill="#334155" />
    <text x="32" y="4" fill="#94a3b8" font-size="10" font-family="sans-serif">Available</text>

    <circle cx="110" cy="0" r="6" fill="#38bdf8" />
    <text x="122" y="4" fill="#94a3b8" font-size="10" font-family="sans-serif">Selected</text>

    <circle cx="200" cy="0" r="6" fill="#f43f5e" />
    <text x="212" y="4" fill="#94a3b8" font-size="10" font-family="sans-serif">Reserved</text>

    <circle cx="290" cy="0" r="6" fill="#fbbf24" />
    <text x="302" y="4" fill="#94a3b8" font-size="10" font-family="sans-serif">VIP</text>
  </g>

  <!-- Bottom CTA in ticket card -->
  <rect x="250" y="325" width="300" height="45" rx="12" fill="url(#goldGrad)" />
  <text x="400" y="353" fill="#000" font-size="13" font-family="sans-serif" text-anchor="middle" font-weight="bold">Book Selected Seats • Galaxy Cinemas</text>
</svg>
